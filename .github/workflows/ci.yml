name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Spotless uses node/npm to run Prettier
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and test
        run: mvn --batch-mode verify -Dplugin.spotless.goal=check
